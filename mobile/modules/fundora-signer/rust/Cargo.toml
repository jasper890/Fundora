[package]
name = "fundora_signer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Testnet-only Stellar signer for the Fundora phone wallet (ADR-0003)."

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
opt-level = "z"
strip = true

[dependencies]
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
sha2 = "0.11.1"
stellar-strkey = "1.0.0"
stellar-xdr = { version = "30.0.0", default-features = false, features = ["std", "base64"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

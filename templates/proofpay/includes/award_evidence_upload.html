{% if is_recipient %}
<section id="award-action">
  <h2>Add a new evidence revision</h2>
  <p>PDF, PNG or JPEG. Up to three files, 5 MiB each. Use synthetic workshop records only.</p>
  <form method="post" enctype="multipart/form-data" action="{% url 'evidence_upload' award.pk %}">
    {% csrf_token %}
    {{ form.as_p }}
    <p>
      <label for="files">Evidence files</label>
      <input id="files" type="file" name="files" multiple required accept="application/pdf,image/jpeg,image/png">
    </p>
    <button>Save evidence revision</button>
  </form>
  <p class="muted">Saving does not sign a submission. Signing will be available with the chain workflow.</p>
</section>
{% endif %}
